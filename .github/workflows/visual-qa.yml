name: Website Visual QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright and browser
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.64.1" "Pillow>=11.0,<12.0"
          python -m playwright install --with-deps chromium

      - name: Render and test website
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/visual_qa.py --base-url http://127.0.0.1:8765/ --output-dir artifacts/site-qa

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa
          path: artifacts/site-qa/
          if-no-files-found: warn
          retention-days: 21
